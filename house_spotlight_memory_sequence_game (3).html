  <style>
    /* =====================================================================
       SMARTBOARD VIEWPORT LOCK & INTERACTION SAFEGUARDS
       ===================================================================== */
    html, body {
      width: 100vw;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f4f6f9;
      font-family: 'Nunito', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-display {
      font-family: 'Fredoka', sans-serif;
    }

    /* Tactile Smartboard buttons */
    .btn-tap {
      transition: transform 0.1s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-tap:active:not(:disabled) {
      transform: scale(0.96);
    }

    /* Glowing golden pulse for active lit room border */
    @keyframes spotlightPulse {
      0%, 100% {
        stroke-width: 0.9;
        filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.95));
      }
      50% {
        stroke-width: 1.4;
        filter: drop-shadow(0 0 14px rgba(251, 191, 36, 1));
      }
    }
    .active-room-glow {
      animation: spotlightPulse 1.3s ease-in-out infinite;
    }

    /* Brief red flash hint border on wrong click */
    @keyframes hintFlash {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.25; }
    }
    .hint-room-flash {
      animation: hintFlash 0.35s ease-in-out infinite;
    }

    /* Gentle shake on wrong click */
    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }
    .animate-shake {
      animation: gentleShake 0.4s ease-in-out;
    }

    /* Word pop animation */
    @keyframes wordPop {
      0% { transform: scale(0.86); opacity: 0.6; }
      60% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-word-pop {
      animation: wordPop 0.24s ease-out;
    }

    /* Capybara smooth glide & squash-and-stretch hop */
    #character-sprite {
      pointer-events: none !important;
      transition: left 0.48s cubic-bezier(0.34, 1.38, 0.64, 1),
                  top 0.48s cubic-bezier(0.34, 1.38, 0.64, 1),
                  opacity 0.2s ease;
    }

    @keyframes capybaraHop {
      0% { transform: translate(-50%, -50%) scale(1, 1); }
      18% { transform: translate(-50%, -44%) scale(1.1, 0.9); }
      48% { transform: translate(-50%, -78%) scale(0.93, 1.1); }
      76% { transform: translate(-50%, -44%) scale(1.06, 0.94); }
      100% { transform: translate(-50%, -50%) scale(1, 1); }
    }
    .character-hopping {
      animation: capybaraHop 0.5s ease-out;
    }

    /* Interactive room hitbox polygons (always top layer & clickable) */
    .room-hitbox {
      pointer-events: auto;
      cursor: pointer;
      transition: fill 0.14s ease, stroke 0.14s ease;
    }
    .room-hitbox:hover {
      fill: rgba(251, 191, 36, 0.18);
      stroke: rgba(251, 191, 36, 0.85);
      stroke-width: 0.55;
    }

    /* Slide-over Settings Drawer animation */
    #settings-drawer {
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    #settings-drawer.drawer-closed {
      transform: translateX(100%);
    }

    /* Subtle scrollbar for sequence rail & modal room list only */
    .thin-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
  </style>

            <input id="input-room-name" type="text" placeholder="Room name (e.g. KITCHEN)" maxlength="24"
              class="w-full px-3 py-2 rounded-xl border-2 border-slate-300 focus:border-sky-500 focus:outline-none font-bold text-sm uppercase bg-white" />

            <div class="grid grid-cols-2 gap-2">
              <button id="btn-undo-point" type="button"
                class="btn-tap py-2 rounded-xl bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold text-xs">
                ↩️ Undo Point
              </button>
              <button id="btn-clear-draft" type="button"
                class="btn-tap py-2 rounded-xl bg-white border border-slate-300 hover:bg-rose-50 hover:text-rose-600 text-slate-700 font-bold text-xs">

              </button>

              class="btn-tap w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-display font-bold text-sm shadow-sm border-b-[3px] border-emerald-700">

                Rooms (<span id="editor-room-count">0</span>)

                class="text-xs font-extrabold text-rose-600 hover:underline">
                Reset to Built-In House
              </button>

          </div>

  </div>

  <script>
    /**
     * =========================================================================
     * HOUSE SPOTLIGHT & MEMORY SEQUENCE — STREAMLINED SMARTBOARD ENGINE
     * =========================================================================
     * Anti-Freeze Guarantees:
     * 1. Every setTimeout is tracked in activeTimers and guarded by state.runId.
     * 2. Web Speech API & Web Audio API are strictly non-blocking fire-and-forget.
     * 3. Dim mask, golden glow, floating word, confetti & capybara use pointer-events: none.
     */

    // =========================================================================
    // 1. DEFAULT 5-ROOM HOUSE DATA & CONSTANTS
    // =========================================================================
    const DEFAULT_ROOMS = [
      { id: 'bedroom',     name: 'BEDROOM',     color: '#8b5cf6', points: [[8, 22.06], [49.8, 22.06], [49.8, 55.15], [8, 55.15]] },
      { id: 'bathroom',    name: 'BATHROOM',    color: '#0ea5e9', points: [[50.2, 22.06], [92, 22.06], [92, 55.15], [50.2, 55.15]] },
      { id: 'living-room', name: 'LIVING ROOM', color: '#14b8a6', points: [[8, 56.62], [35.8, 56.62], [35.8, 89.71], [8, 89.71]] },
      { id: 'kitchen',     name: 'KITCHEN',     color: '#f59e0b', points: [[36.2, 56.62], [63.8, 56.62], [63.8, 89.71], [36.2, 89.71]] },
      { id: 'dining-room', name: 'DINING ROOM', color: '#f97316', points: [[64.2, 56.62], [92, 56.62], [92, 89.71], [64.2, 89.71]] },
    ];

    const ROOM_PALETTE = ['#8b5cf6', '#0ea5e9', '#14b8a6', '#f59e0b', '#f97316', '#ec4899', '#22c55e', '#6366f1'];
    const STORAGE_KEY = 'esl_house_spotlight_smartboard_v1';

    const SPEED_MS = {
      slow:   { lit: 1750, gap: 450 },
      normal: { lit: 1200, gap: 320 },
      fast:   { lit: 780,  gap: 220 },
    };

    // =========================================================================
    // 2. APPLICATION STATE & ANTI-FREEZE TIMER MANAGER
    // =========================================================================
    const state = {
      mode: 'memory', // 'memory' | 'spotlight'
      rooms: JSON.parse(JSON.stringify(DEFAULT_ROOMS)),
      customImageDataUrl: null,
      aspectRatio: 1000 / 680,

      // Teacher Settings (in Slide-Over Drawer)
      startLength: 3,
      speed: 'normal',
      showCapybara: true,
      autoSpeak: false,
      sfxEnabled: true,
      quizMode: false,

      // Active Display State
      activeRoomId: null,
      currentSpeakWord: '',
      wordRevealed: true,

      // Memory Game State
      phase: 'idle', // 'idle' | 'watching' | 'recalling' | 'won'
      level: 1,
      score: 0,
      sequence: [],
      recallIndex: 0,
      runId: 0,

      // Custom Editor State
      editorOpen: false,
      draftPoints: [],
    };

    const activeTimers = new Set();

    function safeTimeout(fn, ms) {
      const id = window.setTimeout(() => {
        activeTimers.delete(id);
        fn();
      }, ms);
      activeTimers.add(id);
      return id;
    }

    function cancelRunningWork() {
      state.runId += 1;
      activeTimers.forEach(id => window.clearTimeout(id));
      activeTimers.clear();
      clearHintBorder();
      try {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } catch (_) {}
    }

    // =========================================================================
    // 3. NON-BLOCKING SOUND FX & WEB SPEECH API (0.85x)
    // =========================================================================
    const SoundFX = {
      ctx: null,
      ensureContext() {
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
        } catch (_) {}
      },
      playTone(freq, duration, type = 'sine', volume = 0.16, delay = 0) {
        if (!state.sfxEnabled) return;
        try {
          this.ensureContext();
          if (!this.ctx) return;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.03);
        } catch (_) {}
      },
      pop() {
        this.playTone(523.25, 0.14, 'triangle', 0.16, 0);
        this.playTone(659.25, 0.12, 'sine', 0.1, 0.05);
      },
      success() {
        this.playTone(523.25, 0.16, 'triangle', 0.18, 0);
        this.playTone(659.25, 0.22, 'triangle', 0.18, 0.09);
      },
      victory() {
        [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => {
          this.playTone(n, 0.25, 'triangle', 0.2, i * 0.11);
        });
      },
      error() {
        this.playTone(230, 0.18, 'sine', 0.16, 0);
        this.playTone(185, 0.24, 'sine', 0.16, 0.11);
      },
    };

    function speakWord(text) {
      if (!text) return;
      try {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(String(text).toLowerCase());
        utter.lang = 'en-US';
        utter.rate = 0.85;
        utter.pitch = 1.02;
        const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
        const preferred = voices.find(v => v.lang && v.lang.startsWith('en-US') && /Google|Samantha|Natural|Microsoft/i.test(v.name))
          || voices.find(v => v.lang && v.lang.startsWith('en'));
        if (preferred) utter.voice = preferred;
        window.speechSynthesis.speak(utter);
      } catch (_) {}
    }

    // =========================================================================
    // 4. DOM REFERENCES
    // =========================================================================
    const el = {
      modeTabs: document.querySelectorAll('.mode-tab'),
      phaseBadge: document.getElementById('phase-badge'),
      bannerWord: document.getElementById('banner-word'),
      btnHeaderSpeak: document.getElementById('btn-header-speak'),
      btnStart: document.getElementById('btn-start'),
      btnStartIcon: document.getElementById('btn-start-icon'),
      btnStartLabel: document.getElementById('btn-start-label'),
      btnReplay: document.getElementById('btn-replay'),
      btnFullscreen: document.getElementById('btn-fullscreen'),
      iconFsEnter: document.getElementById('icon-fs-enter'),
      iconFsExit: document.getElementById('icon-fs-exit'),
      btnOpenSettings: document.getElementById('btn-open-settings'),

      stageWrapper: document.getElementById('stage-wrapper'),
      houseStage: document.getElementById('house-stage'),
      defaultHouseSvg: document.getElementById('default-house-svg'),
      customHouseImg: document.getElementById('custom-house-img'),
      spotlightSvg: document.getElementById('spotlight-svg'),
      maskCutout: document.getElementById('mask-cutout'),
      dimBackdrop: document.getElementById('dim-backdrop'),
      activeRoomBorder: document.getElementById('active-room-border'),
      hintRoomBorder: document.getElementById('hint-room-border'),
      roomHitboxes: document.getElementById('room-hitboxes'),
      characterSprite: document.getElementById('character-sprite'),
      floatingWordPill: document.getElementById('floating-word-pill'),
      confettiCanvas: document.getElementById('confetti-canvas'),

      spotlightDock: document.getElementById('spotlight-dock'),
      btnDockReveal: document.getElementById('btn-dock-reveal'),
      btnDockSpeak: document.getElementById('btn-dock-speak'),
      btnDockClear: document.getElementById('btn-dock-clear'),

      sequenceRail: document.getElementById('sequence-rail'),
      statLevel: document.getElementById('stat-level'),
      statScore: document.getElementById('stat-score'),
      sequenceSlots: document.getElementById('sequence-slots'),
      btnNextLevel: document.getElementById('btn-next-level'),

      settingsBackdrop: document.getElementById('settings-backdrop'),
      settingsDrawer: document.getElementById('settings-drawer'),
      btnCloseSettings: document.getElementById('btn-close-settings'),
      chkCapybara: document.getElementById('chk-capybara'),
      chkAutoSpeak: document.getElementById('chk-autospeak'),
      chkSfx: document.getElementById('chk-sfx'),
      chkQuizMode: document.getElementById('chk-quiz-mode'),
      btnOpenEditor: document.getElementById('btn-open-editor'),

      editorModal: document.getElementById('editor-modal'),
      btnCloseEditor: document.getElementById('btn-close-editor'),
      editorCanvasWrapper: document.getElementById('editor-canvas-wrapper'),
      editorStage: document.getElementById('editor-stage'),
      editorBgDefault: document.getElementById('editor-bg-default'),
      editorBgCustom: document.getElementById('editor-bg-custom'),
      editorSvg: document.getElementById('editor-svg'),
      inputCustomImage: document.getElementById('input-custom-image'),
      editorPointsBadge: document.getElementById('editor-points-badge'),
      inputRoomName: document.getElementById('input-room-name'),
      btnUndoPoint: document.getElementById('btn-undo-point'),
      btnClearDraft: document.getElementById('btn-clear-draft'),
      btnSaveRoom: document.getElementById('btn-save-room'),
      editorStatus: document.getElementById('editor-status'),
      editorRoomCount: document.getElementById('editor-room-count'),
      editorRoomsList: document.getElementById('editor-rooms-list'),
      btnResetHouse: document.getElementById('btn-reset-house'),
    };

    // =========================================================================
    // 5. RESPONSIVE SMARTBOARD STAGE SIZING (Guaranteed Zero Overflow)
    // =========================================================================
    function fitStageBox(wrapperEl, stageEl, ratio) {
      if (!wrapperEl || !stageEl) return;
      const rect = wrapperEl.getBoundingClientRect();
      const pad = 4;
      const availW = Math.max(120, rect.width - pad);
      const availH = Math.max(120, rect.height - pad);
      let w = availW;
      let h = w / ratio;
      if (h > availH) {
        h = availH;
        w = h * ratio;
      }
      stageEl.style.width = `${Math.floor(w)}px`;
      stageEl.style.height = `${Math.floor(h)}px`;
    }

    function fitAllStages() {
      fitStageBox(el.stageWrapper, el.houseStage, state.aspectRatio);
      if (state.editorOpen) {
        fitStageBox(el.editorCanvasWrapper, el.editorStage, state.aspectRatio);
      }
    }

    // =========================================================================
    // 6. GEOMETRY & ROOM HELPERS
    // =========================================================================
    function pointsToSvgString(points) {
      return points.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
    }

    function getRoomCentroid(points) {
      if (!points || !points.length) return { x: 50, y: 50 };
      let sx = 0, sy = 0;
      points.forEach(([x, y]) => { sx += x; sy += y; });
      return { x: sx / points.length, y: sy / points.length };
    }

    function getRoomTopCenter(points) {
      if (!points || !points.length) return { x: 50, y: 20 };
      const c = getRoomCentroid(points);
      const minY = Math.min(...points.map(p => p[1]));
      return { x: c.x, y: Math.max(11, minY + 2) };
    }

    function getRoomById(id) {
      return state.rooms.find(r => r.id === id) || null;
    }

    // =========================================================================
    // 7. BANNER, SPOTLIGHT MASK & CAPYBARA BUDDY
    // =========================================================================
    function setBanner({ badge, badgeClass, word, speakableWord = '' }) {
      if (badge !== undefined) {
        el.phaseBadge.textContent = badge;
        el.phaseBadge.className = `hidden md:inline-flex items-center px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wider whitespace-nowrap shrink-0 ${badgeClass || 'bg-sky-100 text-sky-700'}`;
      }
      if (word !== undefined) {
        el.bannerWord.textContent = word;
        el.bannerWord.classList.remove('animate-word-pop');
        void el.bannerWord.offsetWidth;
        el.bannerWord.classList.add('animate-word-pop');
      }
      state.currentSpeakWord = speakableWord;
      el.btnHeaderSpeak.disabled = !speakableWord;
      el.btnDockSpeak.disabled = !speakableWord;
    }

    function clearHintBorder() {
      el.hintRoomBorder.classList.add('hidden');
      el.hintRoomBorder.setAttribute('points', '');
    }

    function flashExpectedRoomHint(room) {
      if (!room) return;
      el.hintRoomBorder.setAttribute('points', pointsToSvgString(room.points));
      el.hintRoomBorder.classList.remove('hidden');
      const token = state.runId;
      safeTimeout(() => {
        if (token === state.runId) clearHintBorder();
      }, 950);
    }

    function moveCapybaraToRoom(room) {
      if (!state.showCapybara || !room) {
        el.characterSprite.style.opacity = '0';
        return;
      }
      const c = getRoomCentroid(room.points);
      el.characterSprite.style.left = `${c.x}%`;
      el.characterSprite.style.top = `${c.y}%`;
      el.characterSprite.style.opacity = '1';
      el.characterSprite.classList.remove('character-hopping');
      void el.characterSprite.offsetWidth;
      el.characterSprite.classList.add('character-hopping');
    }

    function hideCapybara() {
      el.characterSprite.style.opacity = '0';
    }

    function spotlightRoom(roomId, opts = {}) {
      const {
        dimBackground = true,
        showFloatingWord = true,
        hideWord = false,
        playPop = false,
        triggerAutoSpeak = false,
      } = opts;

      const room = getRoomById(roomId);
      if (!room) {
        clearSpotlight();
        return;
      }

      state.activeRoomId = room.id;
      const pts = pointsToSvgString(room.points);

      el.maskCutout.setAttribute('points', pts);
      el.dimBackdrop.setAttribute('opacity', dimBackground ? '1' : '0');
      el.activeRoomBorder.setAttribute('points', pts);
      el.activeRoomBorder.classList.remove('hidden');

      moveCapybaraToRoom(room);

      if (showFloatingWord && !hideWord) {
        const topPos = getRoomTopCenter(room.points);
        el.floatingWordPill.textContent = room.name;
        el.floatingWordPill.style.left = `${topPos.x}%`;
        el.floatingWordPill.style.top = `${topPos.y}%`;
        el.floatingWordPill.classList.remove('hidden');
      } else {
        el.floatingWordPill.classList.add('hidden');
      }

      if (playPop) SoundFX.pop();
      if (triggerAutoSpeak && state.autoSpeak && !hideWord) {
        speakWord(room.name);
      }
    }

    function clearSpotlight(softDim = false) {
      state.activeRoomId = null;
      el.maskCutout.setAttribute('points', '');
      el.dimBackdrop.setAttribute('opacity', softDim ? '0.32' : '0');
      el.activeRoomBorder.classList.add('hidden');
      el.floatingWordPill.classList.add('hidden');
    }

    // =========================================================================
    // 8. HOUSE ARTWORK & TOP HITBOX LAYER RENDERING
    // =========================================================================
    function renderStageBackground() {
      if (state.customImageDataUrl) {
        el.defaultHouseSvg.classList.add('hidden');
        el.customHouseImg.src = state.customImageDataUrl;
        el.customHouseImg.classList.remove('hidden');
      } else {
        el.customHouseImg.classList.add('hidden');
        el.defaultHouseSvg.classList.remove('hidden');
      }
      fitAllStages();
    }

    function renderRoomHitboxes() {
      el.roomHitboxes.innerHTML = '';
      state.rooms.forEach(room => {
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', pointsToSvgString(room.points));
        poly.setAttribute('fill', 'rgba(255,255,255,0.001)');
        poly.setAttribute('class', 'room-hitbox');
        poly.addEventListener('click', (evt) => {
          evt.stopPropagation();
          handleRoomTap(room.id);
        });
        el.roomHitboxes.appendChild(poly);
      });
    }

    // =========================================================================
    // 9. MEMORY GAME LOGIC & COMPACT SEQUENCE RAIL
    // =========================================================================
    function generateSequence(len) {
      const seq = [];
      if (!state.rooms.length) return seq;
      for (let i = 0; i < len; i++) {
        let pool = state.rooms;
        if (i > 0 && state.rooms.length > 1) {
          pool = state.rooms.filter(r => r.id !== seq[i - 1]);
        }
        seq.push(pool[Math.floor(Math.random() * pool.length)].id);
      }
      return seq;
    }

    function renderSequenceRail(activeWatchIdx = -1) {
      el.statLevel.textContent = state.level;
      el.statScore.textContent = state.score;
      el.sequenceSlots.innerHTML = '';

      if (!state.sequence.length) {
        el.sequenceSlots.innerHTML = `
          <div class="flex-1 flex flex-col items-center justify-center text-center p-3 rounded-2xl bg-slate-50 border border-dashed border-slate-300 text-slate-400">
            <span class="text-2xl mb-1">👆</span>
            <span class="font-display font-bold text-sm">Tap Start</span>
            <span class="text-xs font-bold mt-0.5">Watch the rooms light up!</span>
          </div>`;
        return;
      }

      state.sequence.forEach((roomId, idx) => {
        const room = getRoomById(roomId);
        const slot = document.createElement('div');

        const isWatchingNow = state.phase === 'watching' && idx === activeWatchIdx;
        const isWatchedPast = state.phase === 'watching' && idx < activeWatchIdx;
        const isRecalled = (state.phase === 'recalling' || state.phase === 'won') && idx < state.recallIndex;
        const isNextTarget = state.phase === 'recalling' && idx === state.recallIndex;

        let cls = 'flex items-center justify-between gap-2 px-2.5 py-2.5 rounded-2xl border-2 transition-all shrink-0 ';
        let label = '? ? ?';
        let icon = '';

        if (isWatchingNow) {
          cls += 'bg-amber-100 border-amber-400 scale-[1.02] shadow-sm';
          label = room ? room.name : 'ROOM';
          icon = '👀';
        } else if (isWatchedPast) {
          cls += 'bg-sky-50 border-sky-200';
          label = room ? room.name : 'ROOM';
          icon = '✨';
        } else if (isRecalled) {
          cls += 'bg-emerald-50 border-emerald-400';
          label = room ? room.name : 'ROOM';
          icon = '✅';
        } else if (isNextTarget) {
          cls += 'bg-indigo-50 border-indigo-400 shadow-sm';
          label = '? ? ?';
          icon = '👉';
        } else {
          cls += 'bg-slate-50 border-slate-200';
          icon = '🔒';
        }

        slot.className = cls;
        slot.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-7 h-7 rounded-xl bg-white border border-slate-200 flex items-center justify-center font-display font-bold text-sm text-slate-800 shrink-0">
              ${idx + 1}
            </span>
            <span class="font-display font-bold text-sm tracking-wide truncate ${label.includes('?') ? 'text-slate-400' : 'text-slate-900'}">
              ${label}
            </span>
          </div>
          <span class="text-sm shrink-0">${icon}</span>
        `;
        el.sequenceSlots.appendChild(slot);

        if (isWatchingNow || isNextTarget) {
          slot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });
    }

    function playSequencePattern() {
      if (!state.sequence.length) return;
      cancelRunningWork();
      const myRun = state.runId;

      state.phase = 'watching';
      state.recallIndex = 0;
      el.btnNextLevel.classList.add('hidden');
      el.btnReplay.disabled = false;

      clearSpotlight(true);
      renderSequenceRail(-1);
      setBanner({
        badge: 'Watch & Read',
        badgeClass: 'bg-amber-100 text-amber-800',
        word: 'GET READY...',
        speakableWord: '',
      });

      const timing = SPEED_MS[state.speed] || SPEED_MS.normal;

      function runStep(idx) {
        if (myRun !== state.runId || state.mode !== 'memory') return;

        if (idx >= state.sequence.length) {
          // Switch to Blind-Click Recall Phase
          state.phase = 'recalling';
          state.recallIndex = 0;
          clearSpotlight(false);
          hideCapybara();
          renderSequenceRail(-1);
          setBanner({
            badge: `Your Turn! (${state.sequence.length} Rooms)`,
            badgeClass: 'bg-indigo-100 text-indigo-700',
            word: 'YOUR TURN!',
            speakableWord: '',
          });
          return;
        }

        const roomId = state.sequence[idx];
        const room = getRoomById(roomId);
        if (!room) {
          runStep(idx + 1);
          return;
        }

        renderSequenceRail(idx);
        spotlightRoom(roomId, {
          dimBackground: true,
          showFloatingWord: true,
          hideWord: false,
          playPop: true,
          triggerAutoSpeak: true,
        });
        setBanner({
          badge: `Watch & Read (${idx + 1}/${state.sequence.length})`,
          badgeClass: 'bg-amber-400 text-slate-900',
          word: room.name,
          speakableWord: room.name,
        });

        safeTimeout(() => {
          if (myRun !== state.runId || state.mode !== 'memory') return;
          clearSpotlight(true);
          safeTimeout(() => runStep(idx + 1), timing.gap);
        }, timing.lit);
      }

      safeTimeout(() => runStep(0), 450);
    }

    function startMemoryGame(nextLevel = false) {
      cancelRunningWork();
      if (state.rooms.length < 2) {
        setBanner({
          badge: 'Setup Needed',
          badgeClass: 'bg-rose-100 text-rose-700',
          word: 'ADD 2+ ROOMS',
          speakableWord: '',
        });
        return;
      }

      if (nextLevel) {
        state.level += 1;
      } else {
        state.level = 1;
        state.score = 0;
      }

      const len = state.startLength + (state.level - 1);
      state.sequence = generateSequence(len);
      el.btnStartIcon.textContent = '↻';
      el.btnStartLabel.textContent = 'Restart';

      playSequencePattern();
    }

    function handleMemoryTap(roomId) {
      if (state.phase !== 'recalling') return;

      clearHintBorder();
      const expectedId = state.sequence[state.recallIndex];
      const tappedRoom = getRoomById(roomId);
      if (!tappedRoom) return;

      if (roomId === expectedId) {
        state.recallIndex += 1;
        state.score += 10;

        spotlightRoom(roomId, {
          dimBackground: true,
          showFloatingWord: true,
          hideWord: false,
          playPop: false,
          triggerAutoSpeak: true,
        });

        if (state.recallIndex >= state.sequence.length) {
          state.phase = 'won';
          state.score += 25;
          SoundFX.victory();
          launchConfetti();
          renderSequenceRail(-1);
          el.btnNextLevel.classList.remove('hidden');

          setBanner({
            badge: 'Level Complete! 🎉',
            badgeClass: 'bg-emerald-500 text-white',
            word: tappedRoom.name,
            speakableWord: tappedRoom.name,
          });
        } else {
          SoundFX.success();
          renderSequenceRail(-1);
          setBanner({
            badge: `Great! Next: #${state.recallIndex + 1}`,
            badgeClass: 'bg-emerald-100 text-emerald-700',
            word: tappedRoom.name,
            speakableWord: tappedRoom.name,
          });
        }
      } else {
        // Gentle buzz + brief red hint border on expected room
        SoundFX.error();
        el.houseStage.classList.remove('animate-shake');
        void el.houseStage.offsetWidth;
        el.houseStage.classList.add('animate-shake');

        const expectedRoom = getRoomById(expectedId);
        flashExpectedRoomHint(expectedRoom);

        setBanner({
          badge: 'Try Again!',
          badgeClass: 'bg-rose-100 text-rose-700',
          word: `FIND ROOM #${state.recallIndex + 1}`,
          speakableWord: '',
        });
      }
    }

    // =========================================================================
    // 10. SPOTLIGHT MODE (Full-Width House + Floating Bottom Pill Dock)
    // =========================================================================
    function handleSpotlightTap(roomId) {
      const room = getRoomById(roomId);
      if (!room) return;

      const hideWord = state.quizMode;
      state.wordRevealed = !hideWord;

      spotlightRoom(roomId, {
        dimBackground: true,
        showFloatingWord: true,
        hideWord: hideWord,
        playPop: true,
        triggerAutoSpeak: !hideWord,
      });

      if (hideWord) {
        el.btnDockReveal.classList.remove('hidden');
        setBanner({
          badge: 'Quiz Mode',
          badgeClass: 'bg-amber-400 text-slate-900',
          word: '? ? ?',
          speakableWord: '',
        });
      } else {
        el.btnDockReveal.classList.add('hidden');
        setBanner({
          badge: 'Spotlight',
          badgeClass: 'bg-sky-100 text-sky-700',
          word: room.name,
          speakableWord: room.name,
        });
      }
    }

    function revealSpotlightWord() {
      if (state.mode !== 'spotlight' || !state.activeRoomId || state.wordRevealed) return;
      const room = getRoomById(state.activeRoomId);
      if (!room) return;

      state.wordRevealed = true;
      SoundFX.success();
      el.btnDockReveal.classList.add('hidden');

      const topPos = getRoomTopCenter(room.points);
      el.floatingWordPill.textContent = room.name;
      el.floatingWordPill.style.left = `${topPos.x}%`;
      el.floatingWordPill.style.top = `${topPos.y}%`;
      el.floatingWordPill.classList.remove('hidden');

      setBanner({
        badge: 'Revealed!',
        badgeClass: 'bg-emerald-100 text-emerald-700',
        word: room.name,
        speakableWord: room.name,
      });

      if (state.autoSpeak) speakWord(room.name);
    }

    function handleRoomTap(roomId) {
      if (state.mode === 'memory') {
        handleMemoryTap(roomId);
      } else {
        handleSpotlightTap(roomId);
      }
    }

    // =========================================================================
    // 11. MODE SWITCHING
    // =========================================================================
    function switchMode(newMode) {
      cancelRunningWork();
      state.mode = newMode;
      state.phase = 'idle';
      clearSpotlight(false);
      hideCapybara();

      el.modeTabs.forEach(tab => {
        const active = tab.dataset.mode === newMode;
        tab.className = active
          ? 'mode-tab btn-tap px-3.5 sm:px-4 py-1.5 rounded-xl font-display font-bold text-sm sm:text-base transition-all bg-sky-500 text-white shadow-sm'
          : 'mode-tab btn-tap px-3.5 sm:px-4 py-1.5 rounded-xl font-display font-bold text-sm sm:text-base transition-all text-slate-600 hover:text-slate-900';
      });

      const isMemory = newMode === 'memory';
      el.sequenceRail.classList.toggle('hidden', !isMemory);
      el.btnStart.classList.toggle('hidden', !isMemory);
      el.btnReplay.classList.toggle('hidden', !isMemory);
      el.spotlightDock.classList.toggle('hidden', isMemory);

      if (isMemory) {
        el.btnNextLevel.classList.add('hidden');

        setBanner({
          badge: 'Memory Mode',

          word: 'TAP ANY ROOM',
          speakableWord: '',

    function syncEditorBackground() {
      if (state.customImageDataUrl) {
        el.editorBgDefault.classList.add('hidden');

        el.editorBgCustom.classList.remove('hidden');

    function renderEditorSvg() {
      el.editorSvg.innerHTML = '';
      el.editorPointsBadge.textContent = `${state.draftPoints.length} pt${state.draftPoints.length === 1 ? '' : 's'}`;

      state.rooms.forEach((room, idx) => {
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', pointsToSvgString(room.points));
        poly.setAttribute('fill', room.color || ROOM_PALETTE[idx % ROOM_PALETTE.length]);
        poly.setAttribute('fill-opacity', '0.28');
        poly.setAttribute('stroke', room.color || '#0284c7');
        poly.setAttribute('stroke-width', '0.55');
        el.editorSvg.appendChild(poly);

        const c = getRoomCentroid(room.points);
        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.setAttribute('x', c.x);
        label.setAttribute('y', c.y);
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('dominant-baseline', 'middle');
        label.setAttribute('fill', '#0f172a');
        label.setAttribute('stroke', '#ffffff');
        label.setAttribute('stroke-width', '0.6');
        label.setAttribute('paint-order', 'stroke');
        label.setAttribute('font-size', '3.1');
        label.setAttribute('font-weight', '800');
        label.setAttribute('font-family', 'Fredoka, sans-serif');
        label.textContent = room.name;
        el.editorSvg.appendChild(label);
      });

      if (state.draftPoints.length > 0) {
        const ptsStr = pointsToSvgString(state.draftPoints);
        if (state.draftPoints.length >= 3) {
          const draftPoly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          draftPoly.setAttribute('points', ptsStr);
          draftPoly.setAttribute('fill', 'rgba(251, 191, 36, 0.35)');
          draftPoly.setAttribute('stroke', '#f59e0b');
          draftPoly.setAttribute('stroke-width', '0.65');
          draftPoly.setAttribute('stroke-dasharray', '1.4,0.8');
          el.editorSvg.appendChild(draftPoly);
        } else if (state.draftPoints.length === 2) {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
          line.setAttribute('points', ptsStr);
          line.setAttribute('fill', 'none');
          line.setAttribute('stroke', '#f59e0b');
          line.setAttribute('stroke-width', '0.65');
          el.editorSvg.appendChild(line);
        }

        state.draftPoints.forEach(([x, y], i) => {
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', x);
          dot.setAttribute('cy', y);
          dot.setAttribute('r', i === 0 ? '1.4' : '1.0');
          dot.setAttribute('fill', i === 0 ? '#10b981' : '#fbbf24');
          dot.setAttribute('stroke', '#0f172a');
          dot.setAttribute('stroke-width', '0.3');
          el.editorSvg.appendChild(dot);
        });
      }
    }

    function renderEditorRoomsList() {
      el.editorRoomCount.textContent = state.rooms.length;
      el.editorRoomsList.innerHTML = '';

      if (!state.rooms.length) {
        el.editorRoomsList.innerHTML = '<div class="text-xs font-bold text-slate-400 text-center py-4">Click corners on the image to trace rooms.</div>';
        return;
      }

      state.rooms.forEach(room => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between px-3 py-2 rounded-xl bg-slate-50 border border-slate-200';
        row.innerHTML = `
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-3 h-3 rounded-full shrink-0" style="background:${room.color || '#0ea5e9'}"></span>
            <span class="font-display font-bold text-sm text-slate-800 truncate">${room.name}</span>
          </div>
          <button type="button" class="text-xs font-extrabold text-rose-500 hover:text-rose-700 px-2 py-1 rounded-lg hover:bg-rose-50">
            Delete
          </button>
        `;
        row.querySelector('button').addEventListener('click', () => {
          state.rooms = state.rooms.filter(r => r.id !== room.id);
          state.sequence = [];
          saveCustomData();
          renderEditorRoomsList();
          renderEditorSvg();
          renderRoomHitboxes();
        });

      });

    function openEditorModal() {
      cancelRunningWork();
      closeSettingsDrawer();
      state.editorOpen = true;
      state.draftPoints = [];
      el.editorModal.classList.remove('hidden');
      syncEditorBackground();
      renderEditorRoomsList();
      renderEditorSvg();
      requestAnimationFrame(fitAllStages);
    }

    function closeEditorModal() {
      state.editorOpen = false;
      state.draftPoints = [];
      el.editorModal.classList.add('hidden');
      renderStageBackground();
      renderRoomHitboxes();
      switchMode(state.mode);
    }

    function handleEditorSvgClick(evt) {
      const rect = el.editorSvg.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const x = Math.max(0, Math.min(100, ((evt.clientX - rect.left) / rect.width) * 100));
      const y = Math.max(0, Math.min(100, ((evt.clientY - rect.top) / rect.height) * 100));

      if (state.draftPoints.length >= 3) {
        const [fx, fy] = state.draftPoints[0];
        if (Math.hypot(x - fx, y - fy) < 2.5) {
          SoundFX.pop();
          el.inputRoomName.focus();
          showEditorStatus('Polygon closed! Enter a room name and click Save Room.');
          return;
        }
      }

      state.draftPoints.push([Number(x.toFixed(2)), Number(y.toFixed(2))]);
      SoundFX.pop();
      renderEditorSvg();
    }

    function saveDraftRoom() {
      const name = el.inputRoomName.value.trim().toUpperCase();
      if (state.draftPoints.length < 3) {
        showEditorStatus('Click at least 3 corners on the image first.', true);
        return;
      }
      if (!name) {
        showEditorStatus('Please type a room name first.', true);
        el.inputRoomName.focus();
        return;
      }

      state.rooms.push({
        id: 'room-' + Date.now() + '-' + Math.floor(Math.random() * 1000),
        name,
        color: ROOM_PALETTE[state.rooms.length % ROOM_PALETTE.length],
        points: [...state.draftPoints],
      });
      state.draftPoints = [];
      state.sequence = [];
      el.inputRoomName.value = '';
      SoundFX.success();

      saveCustomData();
      renderEditorRoomsList();
      renderEditorSvg();
      renderRoomHitboxes();
      showEditorStatus(`Saved "${name}"!`);
    }

    function handleCustomImageUpload(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1280;
          let w = img.naturalWidth || 1000;
          let h = img.naturalHeight || 680;
          if (w > MAX || h > MAX) {
            const s = MAX / Math.max(w, h);
            w = Math.round(w * s);
            h = Math.round(h * s);
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);

          state.customImageDataUrl = canvas.toDataURL('image/jpeg', 0.84);
          state.aspectRatio = w / h;
          state.rooms = [];
          state.draftPoints = [];
          state.sequence = [];

          saveCustomData();
          syncEditorBackground();
          renderStageBackground();
          renderEditorRoomsList();
          renderEditorSvg();
          renderRoomHitboxes();
          showEditorStatus('Image uploaded! Click corners to trace each room.');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function resetToBuiltInHouse() {
      state.customImageDataUrl = null;
      state.aspectRatio = 1000 / 680;
      state.rooms = JSON.parse(JSON.stringify(DEFAULT_ROOMS));
      state.draftPoints = [];
      state.sequence = [];
      try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}

      syncEditorBackground();
      renderStageBackground();
      renderEditorRoomsList();
      renderEditorSvg();
      renderRoomHitboxes();
      showEditorStatus('Restored built-in 5-room illustrated house!');
    }

    // =========================================================================
    // 14. LOCALSTORAGE PERSISTENCE
    // =========================================================================
    function saveCustomData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          rooms: state.rooms,
          customImageDataUrl: state.customImageDataUrl,
          aspectRatio: state.aspectRatio,
        }));
      } catch (_) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            rooms: state.rooms,
            customImageDataUrl: null,
            aspectRatio: 1000 / 680,
          }));
        } catch (_) {}
      }
    }

    function loadCustomData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.rooms) && parsed.rooms.length > 0) {
          state.rooms = parsed.rooms;
        }
        if (parsed && parsed.customImageDataUrl) {
          state.customImageDataUrl = parsed.customImageDataUrl;
          state.aspectRatio = parsed.aspectRatio || (16 / 10);
        }
      } catch (_) {}
    }

    // =========================================================================
    // 15. CELEBRATORY CONFETTI ANIMATION
    // =========================================================================
    let confettiParticles = [];
    let confettiRaf = null;

    function launchConfetti() {
      try {
        const canvas = el.confettiCanvas;
        const rect = el.houseStage.getBoundingClientRect();
        canvas.width = Math.max(1, rect.width);
        canvas.height = Math.max(1, rect.height);
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const colors = ['#fbbf24', '#38bdf8', '#f43f5e', '#34d399', '#a78bfa', '#fb923c'];
        confettiParticles = Array.from({ length: 85 }, () => ({
          x: canvas.width * (0.2 + Math.random() * 0.6),
          y: canvas.height * 0.32,
          vx: (Math.random() - 0.5) * 12,
          vy: -Math.random() * 10 - 3,
          size: 7 + Math.random() * 8,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.25,
          life: 1,
        }));

        if (confettiRaf) cancelAnimationFrame(confettiRaf);

        function tick() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          let alive = false;
          confettiParticles.forEach(p => {
            if (p.life <= 0) return;
            alive = true;
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.28;
            p.rot += p.vRot;
            p.life -= 0.015;
            ctx.save();
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
            ctx.restore();
          });
          if (alive) {
            confettiRaf = requestAnimationFrame(tick);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            confettiRaf = null;
          }
        }
        confettiRaf = requestAnimationFrame(tick);
      } catch (_) {}
    }

      try {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      } catch (_) {}
    }

    function syncFullscreenIcons() {
      const isFs = Boolean(document.fullscreenElement);
      el.iconFsEnter.classList.toggle('hidden', isFs);
      el.iconFsExit.classList.toggle('hidden', !isFs);
      requestAnimationFrame(fitAllStages);
    }

    function bindEvents() {
      // Top Header Controls
      el.modeTabs.forEach(tab => {
        tab.addEventListener('click', () => switchMode(tab.dataset.mode));
      });
      el.btnHeaderSpeak.addEventListener('click', () => speakWord(state.currentSpeakWord));
      el.btnStart.addEventListener('click', () => startMemoryGame(false));
      el.btnReplay.addEventListener('click', () => {
        if (state.sequence.length) playSequencePattern();
      });
      el.btnNextLevel.addEventListener('click', () => startMemoryGame(true));
      el.btnFullscreen.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', syncFullscreenIcons);

      // Spotlight Bottom Floating Dock
      el.btnDockReveal.addEventListener('click', revealSpotlightWord);
      el.btnDockSpeak.addEventListener('click', () => speakWord(state.currentSpeakWord));
      el.btnDockClear.addEventListener('click', () => {
        clearSpotlight(false);
        hideCapybara();
        el.btnDockReveal.classList.add('hidden');
        setBanner({
          badge: state.quizMode ? 'Quiz Mode' : 'Spotlight',
          badgeClass: state.quizMode ? 'bg-amber-100 text-amber-800' : 'bg-sky-100 text-sky-700',
          word: 'TAP ANY ROOM',
          speakableWord: '',
        });
      });

      // Settings Drawer
      el.btnOpenSettings.addEventListener('click', openSettingsDrawer);
      el.btnCloseSettings.addEventListener('click', closeSettingsDrawer);
      el.settingsBackdrop.addEventListener('click', closeSettingsDrawer);

      document.querySelectorAll('.len-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.startLength = Number(btn.dataset.len);
          document.querySelectorAll('.len-btn').forEach(b => {
            const active = Number(b.dataset.len) === state.startLength;
            b.className = active
              ? 'len-btn btn-tap py-2 rounded-xl font-display font-bold text-base border-2 border-sky-500 bg-sky-500 text-white'
              : 'len-btn btn-tap py-2 rounded-xl font-display font-bold text-base border-2 border-slate-200 text-slate-600';
          });
        });
      });

      document.querySelectorAll('.speed-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.speed = btn.dataset.speed;
          document.querySelectorAll('.speed-btn').forEach(b => {
            const active = b.dataset.speed === state.speed;
            b.className = active
              ? 'speed-btn btn-tap py-2 rounded-xl text-sm font-extrabold bg-white text-sky-600 shadow-sm'
              : 'speed-btn btn-tap py-2 rounded-xl text-sm font-extrabold text-slate-600';
          });
        });
      });

      el.chkCapybara.addEventListener('change', (e) => {
        state.showCapybara = e.target.checked;
        if (!state.showCapybara) {
          hideCapybara();
        } else if (state.activeRoomId) {
          moveCapybaraToRoom(getRoomById(state.activeRoomId));
        }
      });

      el.chkAutoSpeak.addEventListener('change', (e) => {
        state.autoSpeak = e.target.checked;
      });

      el.chkSfx.addEventListener('change', (e) => {
        state.sfxEnabled = e.target.checked;
      });

      el.chkQuizMode.addEventListener('change', (e) => {
        state.quizMode = e.target.checked;
        if (state.mode === 'spotlight') {
          if (state.activeRoomId) {
            handleSpotlightTap(state.activeRoomId);
          } else {
            setBanner({
              badge: state.quizMode ? 'Quiz Mode' : 'Spotlight',
              badgeClass: state.quizMode ? 'bg-amber-100 text-amber-800' : 'bg-sky-100 text-sky-700',
              word: 'TAP ANY ROOM',
              speakableWord: '',
            });
          }
        }
      });

      // Custom Editor Modal
      el.btnOpenEditor.addEventListener('click', openEditorModal);
      el.btnCloseEditor.addEventListener('click', closeEditorModal);
      el.editorSvg.addEventListener('click', handleEditorSvgClick);
      el.inputCustomImage.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) handleCustomImageUpload(file);
        e.target.value = '';
      });
      el.btnUndoPoint.addEventListener('click', () => {
        state.draftPoints.pop();
        renderEditorSvg();
      });
      el.btnClearDraft.addEventListener('click', () => {
        state.draftPoints = [];
        renderEditorSvg();
      });
      el.btnSaveRoom.addEventListener('click', saveDraftRoom);
      el.inputRoomName.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveDraftRoom();
      });
      el.btnResetHouse.addEventListener('click', resetToBuiltInHouse);

      // Keyboard Shortcuts (Spacebar to Reveal in Spotlight Quiz Mode, Escape to close overlays)
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && document.activeElement && document.activeElement.tagName !== 'INPUT') {
          if (state.mode === 'spotlight' && state.quizMode && state.activeRoomId && !state.wordRevealed) {
            e.preventDefault();
            revealSpotlightWord();
          }
        } else if (e.code === 'Escape') {
          if (state.editorOpen) closeEditorModal();
          else closeSettingsDrawer();
        }
      });

      window.addEventListener('resize', fitAllStages);

      try {
        if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
      } catch (_) {}
    }

    // Boot Application
    window.addEventListener('DOMContentLoaded', () => {
      loadCustomData();
      bindEvents();
      renderStageBackground();
      renderRoomHitboxes();
      switchMode('memory');
      fitAllStages();
    });
  </script>
</body>
</html>
